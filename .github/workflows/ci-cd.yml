name: CI/CD

on: [push, pull_request]

jobs:
  # Linux i386 — legacy Makefile path. Kept for the master-branch
  # workflow; reproduces the original CI's matrix behaviour. Output
  # paths: linux/release/{hl.so,client.so}.
  linux-i386:
    name: Linux-i386
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install G++ Multilib, Clang++ & OpenGL library
        run: |
          sudo apt update
          sudo apt install -y g++-multilib clang libgl1-mesa-dev

      - name: Build (Makefile, i386)
        run: |
          cd linux
          make COMPILER=${{ matrix.compiler }} CFG=release -j2

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: Linux-i386-${{ matrix.compiler }}
          path: |
            linux/release/client.so
            linux/release/client.so.dbg
            linux/release/hl.so
            linux/release/hl.so.dbg

  # Linux amd64 — CMake (top-level) build. The 64bit-branch CMakeLists
  # gates -m32 / -mfpmath=387 to "x86-32 target", so a default cmake
  # invocation on amd64 produces real 64-bit binaries.
  linux-amd64:
    name: Linux-amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake libgl1-mesa-dev

      - name: Configure (amd64)
        run: |
          cmake -B build-amd64 -DCMAKE_BUILD_TYPE=Release

      - name: Build (hl gamedll only)
        # cl_dll/client.so links against the prebuilt x86-32 vgui.so
        # and there's no native 64-bit GoldSrc client engine to load
        # the result anyway — only build the server-side hl gamedll
        # on non-i386, matching the buildchain Makefile pattern.
        run: cmake --build build-amd64 --target hl -j$(nproc)

      - name: Stage per-arch
        run: |
          mkdir -p staged-amd64/dlls
          cp build-amd64/dlls/hl.so staged-amd64/dlls/hl.so

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: Linux-amd64
          path: staged-amd64/**

  # Linux aarch64 — cross-compiled via the in-tree toolchain file.
  # cmake/LinuxToolchain-aarch64.cmake probes for an unversioned
  # aarch64-linux-gnu-gcc first, then falls back to -13.
  linux-aarch64:
    name: Linux-aarch64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install aarch64 cross-toolchain
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential cmake \
            gcc-13-aarch64-linux-gnu g++-13-aarch64-linux-gnu

      - name: Configure (aarch64 cross)
        run: |
          cmake -B build-aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/LinuxToolchain-aarch64.cmake

      - name: Build (hl gamedll only)
        # Same rationale as Linux-amd64: no native 64-bit GoldSrc
        # client engine, and the prebuilt linux/release/vgui.so is
        # x86 only. Server-side hl.so is all that's needed.
        run: cmake --build build-aarch64 --target hl -j$(nproc)

      - name: Stage per-arch
        run: |
          mkdir -p staged-aarch64/dlls
          cp build-aarch64/dlls/hl.so staged-aarch64/dlls/hl.so

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: Linux-aarch64
          path: staged-aarch64/**

  win32:
    name: Win32
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Build
        run: msbuild projects/vs2019/projects.sln -t:rebuild -property:Configuration=Release -maxcpucount:2

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: Win32
          path: |
            projects/vs2019/Release/hl_cdll/client.dll
            projects/vs2019/Release/hl_cdll/client.pdb
            projects/vs2019/Release/hldll/hl.dll
            projects/vs2019/Release/hldll/hl.pdb

  # Win64 — CMake-driven, gamedll only. The projects/vs2019 .sln is
  # Win32-locked (links the prebuilt x86 vgui.lib for cl_dll), so the
  # x64 path uses the top-level CMakeLists.txt with cmake -A x64 and
  # builds just the hl target — same scope as Linux-amd64/aarch64,
  # since there's no native 64-bit GoldSrc client engine to load
  # client.dll on Win64 anyway.
  win64:
    name: Win64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure (Win64)
        run: cmake -B build-win64 -A x64

      - name: Build (hl gamedll only)
        run: cmake --build build-win64 --config Release --target hl -j 2

      - name: Stage per-arch
        shell: bash
        run: |
          mkdir -p staged-win64/dlls
          cp build-win64/dlls/Release/hl.dll staged-win64/dlls/hl.dll
          # PDB is optional but useful for debugging.
          if [ -f build-win64/dlls/Release/hl.pdb ]; then
            cp build-win64/dlls/Release/hl.pdb staged-win64/dlls/hl.pdb
          fi

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: Win64
          path: staged-win64/**
